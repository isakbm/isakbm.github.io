{% assign education = site.data.data-developer.education %}
{% if education %}
<section class="section">

  <div class="section-title"> 
      <svg class="icon-circle" viewBox="0 0 100 100">
        <use href="#icon-circle"></use>
      </svg>
      <svg class="icon" viewBox="0 0 100 100">
        <use href="#icon-education"></use>
      </svg>
    <h2 class="text">Education</h2>
  </div>

  <div class="edu-timeline">
    {% for e in education %}
    <div class="edu-item">
      <svg class="edu-pin" viewBox="0 0 100 100">
        <use href="#icon-bullet"></use>
      </svg>
      <div class="edu-year">{{ e.year }}</div>
      <div class="edu-text">
        <strong>{{ e.degree }}</strong>
        {{ e.field }}<br>
        {{ e.university }}
        {% if e.institute %}<br>{{ e.institute }}{% endif %}
      </div>
    </div>
    {% endfor %}
  </div>

</section>
{% endif %}
