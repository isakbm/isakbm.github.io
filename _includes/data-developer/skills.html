{% assign skills = site.data.data-developer.skills %}
{% if skills %}

<div class="container-block">

  <h2 class="container-block-title">
    {{ skills.title }}
  </h2>

  <ul class="list-unstyled interests-list">
    {% for group in skills.groups %}
    <li>
      <strong>{{ group.name }}</strong><br>
      {{ group.items }}
    </li>
    {% endfor %}
  </ul>

</div>

{% endif %}
